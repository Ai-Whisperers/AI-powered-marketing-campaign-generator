version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maga-postgres
    environment:
      POSTGRES_DB: maga_prod
      POSTGRES_USER: maga_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maga_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maga-network

  redis:
    image: redis:7-alpine
    container_name: maga-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maga-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maga-api
    env_file:
      - .env.production
    volumes:
      - ./data/projects:/app/data/projects
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - maga-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maga-celery
    command: celery -A code.api.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env.production
    volumes:
      - ./data/projects:/app/data/projects
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
      - api
    restart: unless-stopped
    networks:
      - maga-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maga-celery-beat
    command: celery -A code.api.tasks.celery_app beat --loglevel=info
    env_file:
      - .env.production
    volumes:
      - ./data/projects:/app/data/projects
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - maga-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  maga-network:
    driver: bridge
